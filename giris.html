<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsistPsikolog | Kurumsal Sisteme Giriş</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="db.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        :root { --primary: #256839; --primary-dark: #12612d; }
        .login-glow {
            background: radial-gradient(circle at 50% 0%, rgba(37, 104, 57, 0.14) 0%, transparent 65%);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col justify-between login-glow selection:bg-[#256839] selection:text-white">

    <!-- ÜST BAR -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3.5">
                <div class="w-10 h-10 rounded-2xl bg-[#256839] flex items-center justify-center text-white text-lg shadow-md">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <span class="text-xl font-black tracking-tight text-slate-900">asist<span class="text-[#256839]">psikolog</span></span>
                    <span class="block text-[10px] tracking-widest text-emerald-800 font-extrabold uppercase">Kurumsal Randevu Sistemi</span>
                </div>
            </a>

            <a href="index.html" class="text-xs font-bold text-slate-600 hover:text-[#256839] transition flex items-center space-x-1.5 bg-slate-100 hover:bg-emerald-50 px-4 py-2.5 rounded-xl">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Ana Sayfaya Dön</span>
            </a>
        </div>
    </header>

    <!-- ORTA GİRİŞ KARTI -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="max-w-md w-full space-y-5">

            <!-- Zaten Giriş Yapılmışsa Bilgilendirme Kutusu -->
            <div id="aktif-oturum-kutusu" class="hidden bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-xs text-xs space-y-3">
                <div class="flex items-center justify-between">
                    <span class="font-extrabold text-emerald-950 flex items-center">
                        <i class="fa-solid fa-circle-check text-[#256839] mr-2"></i>Açık Oturumunuz Bulunuyor
                    </span>
                    <span id="aktif-oturum-rol-etiket" class="bg-[#256839] text-white px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase"></span>
                </div>
                <p id="aktif-oturum-isim" class="font-bold text-slate-700"></p>
                <div class="flex space-x-2 pt-1">
                    <a id="aktif-oturum-devam-link" href="#" class="w-2/3 bg-[#256839] hover:bg-[#12612d] text-white text-center py-2.5 rounded-xl font-extrabold transition shadow-xs">
                        Panele Devam Et
                    </a>
                    <button type="button" onclick="oturumuKapatVeKal()" class="w-1/3 bg-white hover:bg-red-50 text-red-600 border border-red-200 py-2.5 rounded-xl font-bold cursor-pointer transition">
                        Çıkış Yap
                    </button>
                </div>
            </div>

            <!-- Ana Giriş Form Kartı -->
            <div class="bg-white rounded-3xl border border-slate-200/90 shadow-xl shadow-slate-200/60 p-6 sm:p-8 space-y-6">
                <div class="text-center space-y-1.5">
                    <div id="rol-ikon-daire" class="w-14 h-14 rounded-2xl bg-emerald-50 text-[#256839] flex items-center justify-center text-2xl mx-auto mb-3 border border-emerald-200/60 shadow-inner">
                        <i id="rol-ikon" class="fa-solid fa-headset"></i>
                    </div>
                    <h1 id="giris-baslik" class="text-2xl font-black text-slate-900">Asistan Girişi</h1>
                    <p id="giris-aciklama" class="text-xs text-slate-500">Şube randevu, danışan ve kasa yönetimi için giriş yapın.</p>
                </div>

                <!-- 3 Rol Seçim Sekmesi -->
                <div class="grid grid-cols-3 gap-1.5 bg-slate-100 p-1.5 rounded-2xl text-xs font-extrabold">
                    <button type="button" onclick="rolSec('asistan')" id="rtab-asistan" class="rol-tab-btn py-2.5 px-2 rounded-xl transition flex items-center justify-center space-x-1.5 bg-[#256839] text-white shadow-xs cursor-pointer">
                        <i class="fa-solid fa-headset text-[11px]"></i>
                        <span>Asistan</span>
                    </button>
                    <button type="button" onclick="rolSec('psikolog')" id="rtab-psikolog" class="rol-tab-btn py-2.5 px-2 rounded-xl transition flex items-center justify-center space-x-1.5 text-slate-600 hover:bg-slate-200/60 cursor-pointer">
                        <i class="fa-solid fa-user-doctor text-[11px]"></i>
                        <span>Psikolog</span>
                    </button>
                    <button type="button" onclick="rolSec('yonetici')" id="rtab-yonetici" class="rol-tab-btn py-2.5 px-2 rounded-xl transition flex items-center justify-center space-x-1.5 text-slate-600 hover:bg-slate-200/60 cursor-pointer">
                        <i class="fa-solid fa-user-shield text-[11px]"></i>
                        <span>Yönetici</span>
                    </button>
                </div>

                <!-- Hata Mesajı Kutusu -->
                <div id="giris-hata-kutusu" class="hidden bg-red-50 border border-red-200 text-red-700 p-3.5 rounded-2xl text-xs font-bold flex items-start space-x-2">
                    <i class="fa-solid fa-circle-exclamation mt-0.5 shrink-0"></i>
                    <span id="giris-hata-metni"></span>
                </div>

                <!-- Giriş Formu -->
                <form id="giris-form" onsubmit="girisYap(event)" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">E-Posta Adresi veya Telefon (10 Hane)</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="input-kimlik" required autocomplete="username" placeholder="ornek@herapsikoloji.com veya 5076012945" class="w-full bg-slate-50 pl-10 pr-4 py-3 rounded-xl border border-slate-200 font-bold text-slate-800 focus:outline-none focus:border-[#256839] focus:bg-white transition">
                        </div>
                    </div>

                    <div>
                        <label class="block font-bold text-slate-700 mb-1.5">Şifre</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="password" id="input-sifre" required autocomplete="current-password" placeholder="••••••" class="w-full bg-slate-50 pl-10 pr-10 py-3 rounded-xl border border-slate-200 font-bold text-slate-800 focus:outline-none focus:border-[#256839] focus:bg-white transition">
                            <button type="button" onclick="sifreGosterGizle()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 cursor-pointer">
                                <i id="sifre-goz-ikon" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-[#256839] hover:bg-[#12612d] text-white py-3.5 rounded-xl font-extrabold text-sm shadow-lg shadow-emerald-900/15 transition cursor-pointer flex items-center justify-center space-x-2">
                        <span>Sisteme Giriş Yap</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <!-- Hızlı Test / Demo Giriş Kısayolları -->
                <div class="pt-4 border-t border-slate-100 space-y-2.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Hızlı Test Hesapları (Şifre: 123456)</span>
                        <span class="text-[10px] text-[#256839] font-bold">Tek Tıkla Doldur</span>
                    </div>
                    <div id="hizli-hesaplar-listesi" class="grid grid-cols-1 gap-1.5 max-h-40 overflow-y-auto pr-1"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- ALT BİLGİ -->
    <footer class="py-6 text-center text-xs text-slate-400 font-semibold">
        <span>asistpsikolog &copy; 2026 • Güvenli Kurumsal Oturum Altyapısı</span>
    </footer>

    <script>
        let SECILI_ROL = 'asistan';

        const ROL_BILGILERI = {
            asistan: {
                baslik: "Asistan Girişi",
                aciklama: "Şube randevu, danışan ve kasa yönetimi için giriş yapın.",
                ikon: "fa-solid fa-headset"
            },
            psikolog: {
                baslik: "Uzman Psikolog Girişi",
                aciklama: "Kişisel seans akışınız, danışanlarınız ve çalışma saatleriniz için giriş yapın.",
                ikon: "fa-solid fa-user-doctor"
            },
            yonetici: {
                baslik: "Yönetici Girişi",
                aciklama: "Merkez şubeleri, uzman oranları, kurumsal anlaşmalar ve muhasebe yönetimi.",
                ikon: "fa-solid fa-user-shield"
            }
        };

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const rolParam = urlParams.get('rol');
            if (rolParam && ROL_BILGILERI[rolParam]) {
                SECILI_ROL = rolParam;
            }

            aktifOturumKontrolEt();
            rolSec(SECILI_ROL);
        };

        function aktifOturumKontrolEt() {
            const sess = AsistAuth.getSession();
            const kutu = document.getElementById('aktif-oturum-kutusu');
            if (!sess) {
                kutu.classList.add('hidden');
                return;
            }
            kutu.classList.remove('hidden');
            document.getElementById('aktif-oturum-rol-etiket').innerText = sess.rol;
            document.getElementById('aktif-oturum-isim').innerText = `${sess.ad} olarak oturumunuz açık.`;
            document.getElementById('aktif-oturum-devam-link').href = AsistAuth.hedefSayfa(sess);
        }

        function oturumuKapatVeKal() {
            AsistAuth.logout(null);
            aktifOturumKontrolEt();
        }

        function rolSec(rol) {
            if (!ROL_BILGILERI[rol]) rol = 'asistan';
            SECILI_ROL = rol;

            document.querySelectorAll('.rol-tab-btn').forEach(btn => {
                btn.classList.remove('bg-[#256839]', 'text-white', 'shadow-xs');
                btn.classList.add('text-slate-600', 'hover:bg-slate-200/60');
            });

            const aktifBtn = document.getElementById('rtab-' + rol);
            if (aktifBtn) {
                aktifBtn.classList.remove('text-slate-600', 'hover:bg-slate-200/60');
                aktifBtn.classList.add('bg-[#256839]', 'text-white', 'shadow-xs');
            }

            const bilgi = ROL_BILGILERI[rol];
            document.getElementById('giris-baslik').innerText = bilgi.baslik;
            document.getElementById('giris-aciklama').innerText = bilgi.aciklama;
            document.getElementById('rol-ikon').className = bilgi.ikon;
            document.getElementById('giris-hata-kutusu').classList.add('hidden');

            hizliHesaplariCiz(rol);
        }

        function hizliHesaplariCiz(rol) {
            const db = AsistDB.get();
            const container = document.getElementById('hizli-hesaplar-listesi');
            if (!container) return;
            container.innerHTML = '';

            let liste = [];
            if (rol === 'yonetici') liste = db.yoneticiler || [];
            else if (rol === 'asistan') liste = db.asistanlar || [];
            else if (rol === 'psikolog') liste = (db.psikologlar || []).filter(p => p.durum !== 'pasif');

            liste.forEach(k => {
                let ekBilgi = '';
                if (rol === 'asistan') {
                    let s = db.subeler.find(x => x.id === k.subeId);
                    ekBilgi = s ? s.adi : '';
                } else if (rol === 'psikolog') {
                    let sAdlari = db.subeler.filter(x => (k.subeIds || []).includes(x.id)).map(x => x.adi).join(', ');
                    ekBilgi = sAdlari;
                } else {
                    ekBilgi = 'Merkez Yönetimi';
                }

                const kimlik = k.mail || k.tel;
                const sifre = k.sifre || '123456';

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "w-full text-left p-2 rounded-xl border border-slate-200 hover:border-[#256839] hover:bg-emerald-50/60 transition flex items-center justify-between text-[11px] cursor-pointer";
                btn.onclick = function() {
                    document.getElementById('input-kimlik').value = kimlik;
                    document.getElementById('input-sifre').value = sifre;
                    document.getElementById('giris-hata-kutusu').classList.add('hidden');
                };
                btn.innerHTML = `
                    <div class="truncate pr-2">
                        <span class="font-extrabold text-slate-800">${escapeHtml(k.ad)}</span>
                        <span class="text-slate-400 block text-[10px] truncate">${escapeHtml(ekBilgi)} • ${escapeHtml(kimlik)}</span>
                    </div>
                    <span class="text-[#256839] font-extrabold shrink-0">Seç <i class="fa-solid fa-bolt text-[10px]"></i></span>
                `;
                container.appendChild(btn);
            });
        }

        function sifreGosterGizle() {
            const inp = document.getElementById('input-sifre');
            const ikon = document.getElementById('sifre-goz-ikon');
            if (inp.type === 'password') {
                inp.type = 'text';
                ikon.className = 'fa-regular fa-eye-slash';
            } else {
                inp.type = 'password';
                ikon.className = 'fa-regular fa-eye';
            }
        }

        function girisYap(e) {
            e.preventDefault();
            const kimlik = document.getElementById('input-kimlik').value;
            const sifre = document.getElementById('input-sifre').value;
            const hataKutu = document.getElementById('giris-hata-kutusu');
            const hataMetin = document.getElementById('giris-hata-metni');

            const sonuc = AsistAuth.login(kimlik, sifre, SECILI_ROL);
            if (!sonuc.basarili) {
                hataMetin.innerText = sonuc.mesaj;
                hataKutu.classList.remove('hidden');
                return;
            }

            window.location.href = sonuc.hedefUrl;
        }
    </script>
</body>
</html>
